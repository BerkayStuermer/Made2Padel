<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Seite nicht gefunden – Made2Padel</title>
<link rel="stylesheet" href="/fonts.css">
<style>
:root { --black:#050505; --panel:#161616; --panel-2:#1e1e1e; --line:#262626; --lime:#C5E334; --white:#fff; --gray:#8A8A8A; --gray-l:#C8C8C8;
  color-scheme: dark; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--black); color: var(--white); line-height: 1.65; }
a { color: var(--lime); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 6vw; background: rgba(5,5,5,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.wordmark { font-family: 'Caveat Brush', 'Brush Script MT', cursive; font-size: 1.9rem; line-height: 1; color: var(--white); text-decoration: none; display: inline-block; transform: rotate(-4deg); }
.wordmark span { color: var(--lime); }
.top a.back { font-size: .9rem; color: var(--gray-l); text-decoration: none; }
.top a.back:hover { color: var(--lime); }
.wrap { padding: 4.5rem 6vw 6rem; max-width: 1100px; margin: 0 auto; }
.kicker { font-size: .85rem; color: var(--lime); font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: .6rem; }
.kicker::before { content: ''; width: 28px; height: 2px; background: var(--lime); }
h1 { font-stretch: 125%; font-weight: 800; font-size: clamp(2.2rem, 6vw, 4.4rem); line-height: 1; margin-bottom: 1.25rem; }
h2 { font-stretch: 118%; font-weight: 800; font-size: clamp(1.5rem, 3.2vw, 2.2rem); line-height: 1.1; margin-bottom: 1rem; }
h3 { font-stretch: 110%; font-weight: 700; font-size: 1.15rem; margin-bottom: .4rem; }
.lead { color: var(--gray-l); font-weight: 300; font-size: 1.08rem; max-width: 58ch; }
p.muted { color: var(--gray); font-weight: 300; }
section { margin-top: 5rem; }
.ph { background: rgba(197,227,52,.16); color: var(--lime); border: 1px dashed var(--lime); padding: 0 .35rem; border-radius: 4px; }
.btn { display: inline-block; background: var(--lime); color: var(--black); text-decoration: none; font-weight: 700; padding: .95rem 1.9rem; border-radius: 999px; transition: background .2s, transform .2s; }
.btn:hover { background: var(--white); transform: translateY(-2px); }
.btn-line { display: inline-block; color: var(--white); text-decoration: none; font-weight: 600; padding: .95rem 1.9rem; border-radius: 999px; border: 1px solid #3a3a3a; }
.btn-line:hover { border-color: var(--lime); color: var(--lime); }
.cta { margin-top: 5rem; padding: 3rem; border: 1px solid var(--line); border-radius: 20px; background: radial-gradient(circle at 85% 20%, rgba(197,227,52,.12), transparent 55%), var(--panel); }
.cta p { color: var(--gray-l); font-weight: 300; margin: .5rem 0 1.75rem; max-width: 50ch; }
.reveal { opacity: 0; transform: translateY(30px); transition: opacity .8s cubic-bezier(.16,1,.3,1) var(--d,0s), transform .8s cubic-bezier(.16,1,.3,1) var(--d,0s); }
.reveal.in { opacity: 1; transform: none; }
footer { border-top: 1px solid var(--line); padding: 2rem 6vw; display: flex; gap: 1.5rem; flex-wrap: wrap; font-size: .85rem; }
footer a { color: var(--gray-l); }

.err { min-height: calc(100vh - 140px); min-height: calc(100svh - 140px); display: grid; place-items: center; text-align: center; padding: 3rem 6vw; }
.court { width: min(420px, 80vw); margin: 0 auto 2rem; overflow: visible; }
.court .lines { fill: none; stroke: #3a3a3a; stroke-width: 2; }
.court .net { stroke: var(--white); stroke-width: 3; stroke-dasharray: 4 6; }
.ball404 { animation: out 2.4s cubic-bezier(.3,.1,.4,1) infinite; transform-origin: center; }
@keyframes out { 0% { transform: translate(-150px, 60px) scale(.8); opacity: 0; } 15% { opacity: 1; } 55% { transform: translate(40px, -40px) scale(1.1); } 80% { transform: translate(190px, -110px) scale(.7); opacity: 1; } 100% { transform: translate(230px, -140px) scale(.6); opacity: 0; } }
.code { font-stretch: 125%; font-weight: 800; font-size: clamp(4rem, 14vw, 8rem); line-height: 1; color: var(--lime); }
.err h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: .5rem 0 1rem; }
.err p { color: var(--gray-l); font-weight: 300; max-width: 42ch; margin: 0 auto 2rem; }
.err .row { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .reveal { opacity: 1; transform: none; } }
</style>
</head>
<body>
<header class="top">
  <a href="/index.html" class="wordmark" aria-label="Made2Padel Startseite">made<span>2</span>padel</a>
  <a href="/index.html" class="back">Zur Startseite</a>
</header>

<main class="err">
  <div>
    <svg class="court" viewBox="0 0 400 200" aria-hidden="true">
      <rect class="lines" x="10" y="20" width="380" height="170" rx="4"/>
      <line class="lines" x1="200" y1="20" x2="200" y2="190" style="stroke:none"/>
      <line class="lines" x1="70" y1="20" x2="70" y2="190"/><line class="lines" x1="330" y1="20" x2="330" y2="190"/>
      <line class="lines" x1="70" y1="105" x2="330" y2="105"/>
      <line class="net" x1="200" y1="10" x2="200" y2="200"/>
      <g class="ball404"><circle cx="200" cy="105" r="13" fill="#C5E334"/><path d="M190 96 C196 102 196 108 190 114 M210 96 C204 102 204 108 210 114" stroke="#050505" stroke-width="2" fill="none"/></g>
    </svg>
    <div class="code">404</div>
    <h1>Der Ball war im Aus.</h1>
    <p>Diese Seite gibt es leider nicht. Vielleicht hat sich ein Tippfehler in die Adresse geschlichen, oder die Seite ist umgezogen.</p>
    <div class="row"><a href="/index.html" class="btn">Zur Startseite</a><a href="/index.html#kontakt" class="btn-line">Kontakt aufnehmen</a></div>
  </div>
</main>

<footer><a href="/index.html">Startseite</a><a href="/impressum.html">Impressum</a><a href="/datenschutz.html">Datenschutz</a></footer>
<script>
(function(){
  if (!('IntersectionObserver' in window)) { document.querySelectorAll('.reveal').forEach(e=>e.classList.add('in')); return; }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .15 });
  document.querySelectorAll('.reveal').forEach(e => io.observe(e));
})();

</script>
</body>
</html>
